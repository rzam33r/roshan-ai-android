name: Build and test (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Cache downloaded libraries
        uses: actions/cache@v4
        with:
          path: .cache/rai-deps
          key: deps-${{ hashFiles('deps.lock', 'tests.lock') }}
      - name: Check Android SDK pieces
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/build-tools" "$ANDROID_HOME/platforms"
          test -x "$ANDROID_HOME/build-tools/34.0.0/aapt2"
          test -f "$ANDROID_HOME/platforms/android-34/android.jar"
      - name: Build (unsigned, test only)
        run: bash build.sh
        env:
          RAI_DEP_CACHE: ${{ github.workspace }}/.cache/rai-deps
      - name: Unit tests
        run: bash tests/run_tests.sh
        env:
          RAI_DEP_CACHE: ${{ github.workspace }}/.cache/rai-deps
      - name: Save the unsigned APK for download
        uses: actions/upload-artifact@v4
        with:
          name: RoshanAI-unsigned-v${{ github.run_number }}
          path: out/RoshanAI-unsigned-aligned.apk
          retention-days: 30
          if-no-files-found: error
